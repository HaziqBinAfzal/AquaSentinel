name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check aquasentinel tests scripts/build_user_package.py
      - run: bandit -q -r aquasentinel
      - run: pytest -q
      - run: python -m aquasentinel doctor
      - run: python -m aquasentinel architecture
      - run: python -m aquasentinel analyze --check-only
      - run: python -m aquasentinel web --check-only
      - name: Analyze a supplied file through the real CLI
        run: |
          cat > /tmp/aquasentinel-ci.csv <<'CSV'
          timestamp,severity,ph,conductivity,turbidity,ro_pressure,flow_rate,membrane_health
          2026-01-01T00:00:00Z,info,7.2,420,0.3,58,102,92
          2026-01-01T00:01:00Z,warning,6.2,710,2.1,61,97,69
          CSV
          python -m aquasentinel analyze /tmp/aquasentinel-ci.csv
      - run: python scripts/build_user_package.py
      - name: Verify user package contents
        run: |
          python - <<'PY'
          from zipfile import ZipFile

          archive = 'dist/AquaSentinel-v1.0.0-Windows.zip'
          root = 'AquaSentinel-v1.0.0-Windows/'
          required = {
              root + 'AquaSentinel.bat',
              root + 'README.md',
              root + 'START_HERE.txt',
              root + 'pyproject.toml',
              root + 'aquasentinel/__main__.py',
              root + 'aquasentinel/ingestion.py',
              root + 'aquasentinel/file_analysis.py',
              root + 'aquasentinel/webui.py',
              root + 'tests/test_version.py',
              root + 'tests/test_ingestion.py',
              root + 'tests/test_webui.py',
              root + 'docs/PROJECT_GUIDE.md',
          }
          banned = {
              root + 'aquasentinel/exam_demo.py',
              root + 'docs/EXAM_DEMO.md',
              root + 'run_exam_demo.bat',
              root + 'run_exam_demo.sh',
          }
          with ZipFile(archive) as zf:
              names = set(zf.namelist())
          missing = sorted(required - names)
          present_banned = sorted(banned & names)
          if missing:
              raise SystemExit(f'Missing required distribution files: {missing}')
          if present_banned:
              raise SystemExit(f'Legacy demo files must not be distributed: {present_banned}')
          print(f'Package integrity verified: {len(names)} files; legacy demo files absent')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AquaSentinel-v1.0.0-Windows
          path: dist/AquaSentinel-v1.0.0-Windows.zip
          if-no-files-found: error

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify AquaSentinel.bat end-to-end
        shell: cmd
        run: AquaSentinel.bat --check-only
