name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: pytest -q
      - run: python -m aquasentinel architecture
      - run: python -m aquasentinel run --scenario dosing_event --samples 7
      - run: python -m aquasentinel report --output reports/ci_exam_report.json
