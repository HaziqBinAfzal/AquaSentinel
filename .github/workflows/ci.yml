name: CI
on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check aquasentinel tests
      - run: bandit -q -r aquasentinel
      - run: pytest -q
      - run: python -m aquasentinel --self-check
      - run: python -m aquasentinel --architecture
      - run: python -m aquasentinel --compliance
      - name: Exercise real schema-driven CLI and report export
        run: |
          python - <<'PY'
          import csv
          path='/tmp/aquasentinel-ci.csv'
          with open(path,'w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=['observed_at','ph','turbidity','conductivity'])
              w.writeheader()
              for i in range(30):
                  w.writerow({'observed_at':f'2026-09-01T10:{i:02d}:00Z','ph':7+i*.001,'turbidity':.2+i*.01,'conductivity':500+i})
          PY
          python -m aquasentinel --files /tmp/aquasentinel-ci.csv --command-center --report /tmp/aquasentinel-report.md
          test -s /tmp/aquasentinel-report.md
          grep -q 'SHA-256' /tmp/aquasentinel-report.md
          grep -q 'not proof of contamination' /tmp/aquasentinel-report.md

  windows-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Verify Windows-compatible CLI imports
        shell: cmd
        run: python -m aquasentinel --self-check
