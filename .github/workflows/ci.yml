name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check aquasentinel tests scripts/build_user_package.py
      - run: bandit -q -r aquasentinel
      - run: pytest -q
      - run: python -m aquasentinel doctor
      - run: python -m aquasentinel architecture
      - run: python -m aquasentinel run --scenario dosing_event --samples 7
      - run: python -m aquasentinel live --scenario optimization --samples 1 --refresh-rate 10
      - run: python -m aquasentinel web --check-only
      - run: python -m aquasentinel incident --scenario dosing_event --step 8
      - run: python -m aquasentinel exam-demo --pause 0
      - run: python -m aquasentinel report --output reports/ci_exam_report.json
      - run: python scripts/build_user_package.py
      - name: Verify user package contents
        run: |
          python - <<'PY'
          from zipfile import ZipFile

          archive = 'dist/AquaSentinel-v1.0.0-Windows.zip'
          root = 'AquaSentinel-v1.0.0-Windows/'
          required = {
              root + 'AquaSentinel.bat',
              root + 'README.md',
              root + 'START_HERE.txt',
              root + 'pyproject.toml',
              root + 'aquasentinel/__main__.py',
              root + 'aquasentinel/webui.py',
              root + 'tests/test_version.py',
              root + 'tests/test_webui.py',
              root + 'assets/aquasentinel-terminal.svg',
              root + 'docs/PROJECT_GUIDE.md',
          }
          with ZipFile(archive) as zf:
              names = set(zf.namelist())
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f'Missing required distribution files: {missing}')
          print(f'Package integrity verified: {len(names)} files')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AquaSentinel-v1.0.0-Windows
          path: dist/AquaSentinel-v1.0.0-Windows.zip
          if-no-files-found: error

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify AquaSentinel.bat end-to-end
        shell: cmd
        run: AquaSentinel.bat --check-only
