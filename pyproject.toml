[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aquasentinel-ai"
version = "0.3.0"
description = "Safe simulated smart water and desalination infrastructure security platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "rich>=13.7,<15",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
  "bandit>=1.8,<2",
]

[project.scripts]
aquasentinel = "aquasentinel.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
