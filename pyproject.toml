[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aquasentinel-ai"
version = "1.0.0"
description = "Schema-driven defensive smart water and desalination evidence analysis workstation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "rich>=13.7,<15",
  "scikit-learn>=1.5,<2",
  "openpyxl>=3.1,<4",
  "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
  "bandit>=1.8,<2",
]

[project.scripts]
aquasentinel = "aquasentinel.__main__:main"

[tool.setuptools.packages.find]
include = ["aquasentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
